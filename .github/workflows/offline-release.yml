name: Prepare GRK release for offline signing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-release.yml'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK and install required packages only
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --version
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]]; then
            "$sdkmanager" 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: bash tests/run-host-tests.sh
      - run: gradle --no-daemon assembleRelease lintRelease
      - name: Prepare aligned release and offline signing utility
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p offline-release
          "$tools/zipalign" -f -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk offline-release/GRK-release-aligned-unsigned.apk
          "$tools/zipalign" -c -P 16 4 offline-release/GRK-release-aligned-unsigned.apk
          "$tools/aapt" dump badging offline-release/GRK-release-aligned-unsigned.apk | tee offline-release/apk-badging.txt
          if grep -q 'application-debuggable' offline-release/apk-badging.txt; then echo 'Debuggable release rejected'; exit 1; fi
          cp "$tools/lib/apksigner.jar" offline-release/apksigner.jar
          (cd offline-release && sha256sum GRK-release-aligned-unsigned.apk apksigner.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: GRK-offline-release-signing-inputs
          path: offline-release/
          retention-days: 7
          if-no-files-found: error
