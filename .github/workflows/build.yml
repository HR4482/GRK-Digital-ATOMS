name: Build GRK Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK and install required packages only
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --version
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]]; then
            "$sdkmanager" 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: bash tests/run-host-tests.sh
      - run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GRK-Spatial-Audio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
