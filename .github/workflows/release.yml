name: Build signed GRK release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: bash tests/run-host-tests.sh
      - run: gradle --no-daemon assembleRelease lintRelease
      - name: Align, sign and verify APK
        shell: bash
        env:
          GRK_KEYSTORE_B64: ${{ secrets.GRK_KEYSTORE_B64 }}
          GRK_KEYSTORE_PASSWORD: ${{ secrets.GRK_KEYSTORE_PASSWORD }}
          GRK_KEY_ALIAS: ${{ secrets.GRK_KEY_ALIAS }}
          GRK_KEY_PASSWORD: ${{ secrets.GRK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in GRK_KEYSTORE_B64 GRK_KEYSTORE_PASSWORD GRK_KEY_ALIAS GRK_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Missing required signing secret: $name" >&2; exit 1; fi
          done
          umask 077
          keyfile="$(mktemp "$RUNNER_TEMP/grk-key.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$GRK_KEYSTORE_B64" | base64 --decode > "$keyfile"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release-output
          "$tools/zipalign" -f -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/grk-aligned.apk"
          apk=release-output/GRK_Immersive_Audio_v0.4.0.apk
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$GRK_KEY_ALIAS" --ks-pass env:GRK_KEYSTORE_PASSWORD --key-pass env:GRK_KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/grk-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          (cd release-output && sha256sum GRK_Immersive_Audio_v0.4.0.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: GRK-Immersive-Audio-signed-release-candidate
          path: release-output/
          if-no-files-found: error
